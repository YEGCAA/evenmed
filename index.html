
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVEN MED | Assessoria de Marketing Médico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1E88E5;
            --navy-blue: #003366;
            --teal-green: #1E88E5;
            --coral-cta: #FF6B35;
            --bg-presentation: #000000;
            --text-main: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            background-color: var(--bg-presentation);
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Poppins', sans-serif;
        }

        .snap-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .snap-section {
            scroll-snap-align: start;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .bg-medical-navy { background-color: var(--navy-blue); }
        .bg-medical-blue { background-color: var(--primary-blue); }
        .bg-medical-teal { background-color: var(--primary-blue); }
        .bg-medical-coral { background-color: var(--coral-cta); }
        .text-medical-blue { color: var(--primary-blue); }
        .text-medical-teal { color: var(--primary-blue); }
        
        .medical-card {
            background: #0A0A0A;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            border: 1px solid #1A1A1A;
        }

        .medical-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(30, 136, 229, 0.1);
            border-color: var(--primary-blue);
        }

        .hero-gradient {
            background: radial-gradient(circle at center, #001a33 0%, #000000 100%);
        }

        .btn-coral {
            background-color: var(--coral-cta);
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-coral:hover {
            background-color: #e65a2b;
            transform: scale(1.05);
        }

        .snap-container::-webkit-scrollbar {
            display: none;
        }
        .snap-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
